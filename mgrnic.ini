; WAF 管理口初始化与 Docker 业务网卡加载配置（UTF-8 编码）
; interface、physical_id、mac 三项只填写一项；留空时等待配置，不自动选择网卡。
; Windows 示例：interface = 以太网
; Linux 示例：interface = enp1s0
; 物理标识可在系统配置页面查看；MAC 支持 AA:BB:CC:DD:EE:FF 或 AA-BB-CC-DD-EE-FF。
; 管理口首次初始化成功后不再覆盖页面配置。
; 业务口有独立的加载状态，已初始化的系统也可填写业务口后重启加载。

[management]
alias = mgmt0
interface =
physical_id =
mac =
ip = 192.168.1.1/24
nic_count = 3
; true：初始化时添加管理 IP，需要管理员 / root 权限。
; false：仅导入配置，稍后在系统配置页面手动应用 IP。
apply_ip = true

; Docker 使用 host 网络，容器内接口名与宿主机一致，无需 devices 或端口映射。
; 每个业务节以系统业务网卡别名命名，三个选择项只填写一项。
; 建议填写 MAC，以避免 Ubuntu 网卡重命名的影响。留空不绑定、不启用网口。
; 独立业务口不能与管理口重复，也不能带 IPv4 / 全局 IPv6 地址。
; 旁挂模式在页面选择镜像业务口；串联模式选择入口和出口两个业务口。
[business:port1]
interface =
physical_id =
mac =
bring_up = true

[business:port2]
interface =
physical_id =
mac =
bring_up = true
